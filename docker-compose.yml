services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: false
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: jobhunter
      DB_USERNAME: postgres
      DB_PASSWORD: password
      SCRAPER_SERVICE_URL: http://scraper:5000
      FRONTEND_URL: http://localhost
      AI_API_KEY: ${AI_API_KEY}
    depends_on:
      - postgres
      - scraper

  scraper:
    build: ./scraper
    ports:
      - "5000:5000"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
